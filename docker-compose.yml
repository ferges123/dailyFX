services:
  # Optional PostgreSQL 16 service.
  # - Not started by default (SQLite remains the default backend).
  # - Internal PG:  docker compose --profile pg up --build -d
  #   (or: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build -d)
  # - External PG (postgres in another docker/host): leave this service
  #   stopped and set DATABASE_URL in .env to point at it, e.g.
  #   DATABASE_URL=postgresql+psycopg://dailyfx:secret@other-host:5432/dailyfx
  db:
    container_name: dailyfx-db
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["pg"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dailyfx}"
      POSTGRES_USER: "${POSTGRES_USER:-dailyfx}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dailyfx}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dailyfx} -d $${POSTGRES_DB:-dailyfx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    container_name: dailyfx-api
    image: ghcr.io/ferges123/dailyfx-api:latest
    build: ./backend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8438:8438"
    networks:
      - default
      # Access to the shared external Postgres (host `postgres`).
      # Unused when DATABASE_URL points to SQLite — harmless then.
      - selfhost
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    container_name: dailyfx-web
    image: ghcr.io/ferges123/dailyfx-web:latest
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8439:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    name: dailyfx-pgdata

networks:
  # Shared network of the external /app/postgresql stack (host `postgres`).
  selfhost:
    external: true
